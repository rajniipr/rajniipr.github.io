<!DOCTYPE html>
<html>
<head>
  <title>API Score Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f7fa;
    }
    h2 {
      color: #2c3e50;
    }
    input, select, button {
      padding: 8px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #2c3e50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #34495e;
    }
    table {
      border-collapse: collapse;
      margin-top: 20px;
      width: 100%;
      background: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #2c3e50;
      color: white;
    }
    .total {
      margin-top: 10px;
      font-weight: bold;
    }
    .footer {
      margin-top: 40px;
      text-align: center;
      color: gray;
    }
  </style>
</head>

<body>

<h2>API Score Calculator</h2>

<!-- ================= PUBLICATIONS ================= -->

<h3>Journal Publications</h3>

<input type="number" id="if" step="0.1" placeholder="Impact Factor">

<select id="author">
  <option value="Corresponding">Corresponding</option>
  <option value="Coauthor">Coauthor</option>
</select>

<button onclick="addPublication()">Add Publication</button>

<table id="pubTable">
  <tr>
    <th>#</th>
    <th>IF</th>
    <th>Author</th>
    <th>Score</th>
  </tr>
</table>

<div class="total">
  Publication Score: <span id="pubTotal">0.00</span>
</div>

<hr>

<!-- ================= BOOKS / CHAPTERS ================= -->

<h3>Books / Chapters / Translation</h3>

<select id="bookType">
  <option value="">Select Activity</option>
  <option value="12">Book – International Publisher</option>
  <option value="10">Book – National Publisher</option>
  <option value="5">Chapter in Edited Book</option>
  <option value="10">Editor – International Publisher</option>
  <option value="8">Editor – National Publisher</option>
  <option value="3">Translation – Chapter/Paper</option>
  <option value="8">Translation – Book</option>
</select>

<button onclick="addBook()">Add Entry</button>

<table id="bookTable">
  <tr>
    <th>#</th>
    <th>Activity</th>
    <th>Score</th>
  </tr>
</table>

<div class="total">
  Books Score: <span id="bookTotal">0.00</span>
</div>

<hr>

<!-- ================= FINAL TOTAL ================= -->

<h3>Total API Score: <span id="finalTotal">0.00</span></h3>

<div class="footer">
  Thank you for using..by Rajnikant
</div>

<script>

// ===== PUBLICATION LOGIC =====

let pubTotal = 0;
let pubCount = 0;

function getImpactScore(IF) {
  if (IF === 0) return 5;
  if (IF < 1) return 10;
  if (IF < 2) return 15;
  if (IF < 5) return 20;
  if (IF < 10) return 25;
  return 30;
}

function addPublication() {
  let IF = parseFloat(document.getElementById("if").value);
  let author = document.getElementById("author").value;

  if (isNaN(IF)) {
    alert("Enter Impact Factor");
    return;
  }

  let base = 8;
  let impact = getImpactScore(IF);
  let raw = base + impact;

  let weight = (author === "Corresponding") ? 0.7 : 0.3;
  let score = raw * weight;

  pubTotal += score;
  pubCount++;

  let table = document.getElementById("pubTable");
  let row = table.insertRow();

  row.insertCell(0).innerText = pubCount;
  row.insertCell(1).innerText = IF;
  row.insertCell(2).innerText = author;
  row.insertCell(3).innerText = score.toFixed(2);

  document.getElementById("pubTotal").innerText = pubTotal.toFixed(2);

  updateTotal();
}

// ===== BOOK LOGIC =====

let bookTotal = 0;
let bookCount = 0;

function addBook() {
  let select = document.getElementById("bookType");
  let score = parseFloat(select.value);
  let text = select.options[select.selectedIndex].text;

  if (!score) {
    alert("Select activity");
    return;
  }

  bookTotal += score;
  bookCount++;

  let table = document.getElementById("bookTable");
  let row = table.insertRow();

  row.insertCell(0).innerText = bookCount;
  row.insertCell(1).innerText = text;
  row.insertCell(2).innerText = score;

  document.getElementById("bookTotal").innerText = bookTotal.toFixed(2);

  updateTotal();
}

// ===== FINAL TOTAL =====

function updateTotal() {
  let final = pubTotal + bookTotal;
  document.getElementById("finalTotal").innerText = final.toFixed(2);
}

</script>

</body>
</html>
