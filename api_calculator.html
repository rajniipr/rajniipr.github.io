<!DOCTYPE html>
<html>
<head>
  <title>API Score Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f7fa;
    }
    h2 {
      color: #2c3e50;
    }
    input, select, button {
      padding: 8px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #2c3e50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #34495e;
    }
    table {
      border-collapse: collapse;
      margin-top: 20px;
      width: 100%;
      background: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #2c3e50;
      color: white;
    }
    .total {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    .footer {
      margin-top: 40px;
      text-align: center;
      color: gray;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h2>Publication API Score Calculator</h2>

<label>Impact Factor:</label>
<input type="number" id="if" step="0.1" placeholder="Enter IF">

<label>Author Type:</label>
<select id="author">
  <option value="Corresponding">Corresponding</option>
  <option value="Coauthor">Coauthor</option>
</select>

<button onclick="calculate()">Add Publication</button>
<button onclick="resetAll()">Reset</button>

<table id="table">
  <tr>
    <th>#</th>
    <th>Impact Factor</th>
    <th>Author</th>
    <th>Score</th>
  </tr>
</table>

<div class="total">
  Total API Score: <span id="total">0.00</span>
</div>

<div class="footer">
  Thank you for using..by Rajnikant
</div>

<script>
let total = 0;
let count = 0;

function getImpactScore(IF) {
  if (IF === 0) return 5;
  if (IF < 1) return 10;
  if (IF < 2) return 15;
  if (IF < 5) return 20;
  if (IF < 10) return 25;
  return 30;
}

function calculate() {
  let IF = parseFloat(document.getElementById("if").value);
  let author = document.getElementById("author").value;

  if (isNaN(IF)) {
    alert("Please enter a valid Impact Factor");
    return;
  }

  let base = 8;
  let impact = getImpactScore(IF);
  let raw = base + impact;

  let weight = (author === "Corresponding") ? 0.7 : 0.3;
  let finalScore = raw * weight;

  total += finalScore;
  count++;

  let table = document.getElementById("table");
  let row = table.insertRow();

  row.insertCell(0).innerText = count;
  row.insertCell(1).innerText = IF;
  row.insertCell(2).innerText = author;
  row.insertCell(3).innerText = finalScore.toFixed(2);

  document.getElementById("total").innerText = total.toFixed(2);

  document.getElementById("if").value = "";
}

function resetAll() {
  total = 0;
  count = 0;

  let table = document.getElementById("table");
  table.innerHTML = `
    <tr>
      <th>#</th>
      <th>Impact Factor</th>
      <th>Author</th>
      <th>Score</th>
    </tr>
  `;

  document.getElementById("total").innerText = "0.00";
}
</script>

</body>
</html>
